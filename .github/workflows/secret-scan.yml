name: secret-scan
on:
  push:
    branches:
      - main
    tags: ['*']
  workflow_call:
  workflow_dispatch:
  pull_request:
jobs:
  no_public_web_tokens:
    name: No hard-coded public-web URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: python3 .github/scripts/check_no_public_web_tokens.py
